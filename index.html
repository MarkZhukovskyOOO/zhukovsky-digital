    <script>
      /* Тема применяется до отрисовки — без мигания. */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var saved = localStorage.getItem("theme");
          /* По умолчанию — светлая тема. Системную не наследуем;
             уважаем только явный выбор (?theme=… или сохранённый). */
          var theme =
            (q === "dark" || q === "light" ? q : null) || saved || "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
